add_magnet:
  name: Add magnet
  description: Add one torrent from a magnet link.
  fields:
    entry_id:
      required: true
      selector: {config_entry: {integration: qbittorrent_enhanced}}
    magnet_url:
      required: true
      selector: {text: {multiline: true}}
    save_path:
      required: false
      selector: {text: {}}
    category:
      required: false
      selector: {text: {}}
    tags:
      required: false
      selector: {text: {multiple: true}}
    skip_checking:
      required: false
      default: false
      selector: {boolean: {}}
    paused:
      required: false
      default: false
      selector: {boolean: {}}
    content_layout:
      required: false
      selector:
        select:
          options:
            - Original
            - Subfolder
            - NoSubfolder
    rename:
      required: false
      selector: {text: {}}
    upload_limit:
      required: false
      description: Upload speed limit in MB/s. 0 means unlimited.
      selector: {number: {min: 0, max: 1000, step: 1, mode: slider}}
    download_limit:
      required: false
      description: Download speed limit in MB/s. 0 means unlimited.
      selector: {number: {min: 0, max: 1000, step: 1, mode: slider}}
    ratio_limit:
      required: false
      description: Seeding ratio limit. -1 means no limit.
      selector: {number: {min: -1, max: 1000, step: 1, mode: slider}}
    seeding_time_limit:
      required: false
      description: Maximum seeding time in minutes. -1 means no limit.
      selector: {number: {min: -1, max: 100000, step: 1, mode: slider}}
    auto_tmm:
      required: false
      selector: {boolean: {}}

get_torrents:
